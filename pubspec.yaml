name: iibrain
description: "IIbrain: a private second brain of plain Markdown files."
publish_to: 'none'

# App version. The desktop workspace carries the same one
# (desktop/Cargo.toml; a test in iibrain-core checks it).
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # The call into the core's shared library (docs/adr/0011).
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
