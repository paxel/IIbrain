include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - desktop/**
  # Strict typing: no implicit downcasts from dynamic, no raw generic
  # types, no inference that falls back to dynamic.
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  # The Dart counterpart of the Rust panic rules (desktop/Cargo.toml): a
  # dynamic call, a future nobody awaits or handles, a subscription or sink
  # left open, and a BuildContext used after a gap fail the analysis.
  errors:
    avoid_dynamic_calls: error
    unawaited_futures: error
    discarded_futures: error
    cancel_subscriptions: error
    close_sinks: error
    use_build_context_synchronously: error

linter:
  rules:
    - avoid_dynamic_calls
    - unawaited_futures
    - discarded_futures
    - cancel_subscriptions
    - close_sinks
    - use_build_context_synchronously
