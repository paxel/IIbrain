[workspace]
resolver = "2"
members = [
    "crates/iibrain-core",
    "crates/iibrain-l10n",
    "crates/iibrain-gui",
    "crates/iibrain-ffi",
    "crates/iibrain-testing",
]

# The version equals the pubspec's (a test in iibrain-core checks it).
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/paxel/IIbrain"

# No unsafe and no panics. Tests may unwrap, expect, panic and index
# (clippy.toml).
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

# RustO is far too slow unoptimised, also in `cargo test`.
[profile.dev.package.rusto-rs]
opt-level = 3
[profile.dev.package.clipper2-rust]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
# Decoding a photo too.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
