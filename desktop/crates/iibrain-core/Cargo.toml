[package]
name = "iibrain-core"
description = "Core of IIbrain, shared by the phone app and the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "iibrain_core"

[dependencies]
# The index: SQLite with its full-text search, built in.
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The frontmatter of a Note, with the keys other tools wrote kept.
serde_yaml_ng = "0.10"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
