[package]
name = "iibrain-core"
description = "Core of IIbrain, shared by the phone app and the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "iibrain_core"

[dependencies]
# The index: SQLite with its full-text search, built in.
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The frontmatter of a Note, with the keys other tools wrote kept.
serde_yaml_ng = "0.10"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Photos and scanned pages, decoded for the text recognition.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
# Text in photos (ADR 0007), as Old Brain Fix reads it: RustO without its
# UniFFI bindings, and rten, rten-tensor and ndarray at RustO's own
# versions to load the bundled models from bytes.
rusto-rs = { version = "0.3.2", default-features = false }
rten = { version = "0.27.0", default-features = false, features = ["rten_format"] }
rten-tensor = "0.27.0"
ndarray = { version = "0.16.1", default-features = false }
# The page behind a link, fetched by the Device itself, and later the
# Model's endpoint. TLS by rustls with its bundled roots, on the phone too.
ureq = { version = "3", features = ["json"] }
# The fetched page, parsed to take its readable text.
scraper = "0.29"
# PDFs: their text layer, and the page images of scanned ones.
lopdf = { version = "0.47", default-features = false }

[dev-dependencies]
iibrain-testing = { path = "../iibrain-testing" }
tempfile = "3.10"

[lints]
workspace = true
